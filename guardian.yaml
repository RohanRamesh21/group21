# Guardian policy (sample). Agents read it with policy_lookup; humans own changes to it.
registries:
  allowed_hosts: [registry.npmjs.org, "localhost:4873"]   # localhost:4873 = testbed stand-in for public npm
  # Hosts the Guardian may fetch from to analyse packages (the local test registry is reachable
  # for analysis, but packages resolved from it are still flagged: it is NOT an allowed install source).
  fetch_hosts: [registry.npmjs.org, api.npmjs.org, api.osv.dev, "localhost:4873", "127.0.0.1:4873"]
internal_scopes: []
images:
  require_digest: true
typosquat:
  max_distance: 2
install_scripts:
  allowlist: [esbuild, core-js, "@fortawesome/fontawesome-common-types", "@fortawesome/fontawesome-svg-core",
              "@fortawesome/free-regular-svg-icons", "@fortawesome/free-solid-svg-icons", cpu-features, protobufjs]
sensitive_paths: [".npmrc", ".yarnrc", ".github/workflows/*", ".vscode/tasks.json", ".claude/settings.json", ".git/hooks/*"]
# Sandbox for every tool that reads an untrusted repository (guardian/sandbox, docs/SETUP.md).
sandbox:
  mode: podman            # podman | host  (host = developer escape hatch: no isolation, reported in every scan)
  limits: {memory: 2g, cpus: "2", pids: 512, timeout_s: 900, tmp_size: 512m}
  npm_registry_hosts: [registry.npmjs.org]   # the only hosts lockfile resolution may reach (through the egress proxy)
  images:                 # pinned by digest (CLAUDE.md §3.3); `guardian sandbox setup` pulls them, scans never pull
    node: docker.io/library/node:24-alpine@sha256:d8d97e479cdc64f052f81f129362168717c59783ade8dcc1abd22e1cca8dbd7c
    syft: docker.io/anchore/syft:v1.57.2@sha256:9c2563b5fb56e9f5e9cb5b6cf10b9ab0dc6a6d1c1b1e24165bcdf9c8c85a9584
    grype: docker.io/anchore/grype:v0.122.1@sha256:f51a9094a94d5842328a89f11175dfbec7ca7cf148c7fdd0030d1747cff7df7f
    osv-scanner: ghcr.io/google/osv-scanner:v2.7.1@sha256:bc10cae80da100d32572aea48cfc48e592be9adc4a8b0820fd5d2c2db71f9446
    zizmor: ghcr.io/zizmorcore/zizmor:1.33.1@sha256:e308cf5848d9660e463ad07280f5bc009d4c4ea3a5ed4f851a1e1b72b5828248
